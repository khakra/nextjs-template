name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `next build` succeeds without real infrastructure.
      # No page should reach the network at build time — if the build starts
      # failing on these, something is querying the DB/API during prerender.
      DATABASE_URL: postgresql://user:password@localhost:5432/dummy
      BETTER_AUTH_SECRET: ci-dummy-secret-not-used-in-production
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_PROJECT_NAME: CI Build
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_META_DESCRIPTION: CI build
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
