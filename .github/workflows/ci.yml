name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `next build` succeeds without real infrastructure.
      # No page should reach the network at build time — if the build starts
      # failing on these, something is querying the DB/API during prerender.
      DATABASE_URL: postgresql://user:password@localhost:5432/dummy
      BETTER_AUTH_SECRET: ci-dummy-secret-not-used-in-production
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_PROJECT_NAME: CI Build
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_META_DESCRIPTION: CI build
    steps:
      - uses: actions/checkout@v7
      # Latest 10.x; the lockfile format is the same across a major
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  # Merge Dependabot minor/patch PRs once the ci job above has passed.
  # Majors are left for review (`pnpm upgrade:deps`).
  automerge:
    needs: ci
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge "$PR_URL" --squash --delete-branch
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
