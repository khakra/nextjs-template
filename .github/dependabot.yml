# Weekly dependency updates:
# - one PR for all minor/patch bumps, auto-merged once CI passes
#   (see the automerge job in ci.yml). Keeping it to a single PR avoids
#   pnpm-lock.yaml conflicts between sibling PRs.
# - majors arrive as individual PRs and are never auto-merged; handle them
#   with `pnpm upgrade:deps`. Dependabot rebases them when main moves.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Keep the GitHub Actions used in workflows up to date too
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
